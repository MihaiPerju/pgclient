[package]
name = "pgclient-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net"] }
tokio-postgres = "0.7"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
